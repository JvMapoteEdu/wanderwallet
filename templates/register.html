{% extends 'base.html' %}
{% block title %}Register – WanderWallet{% endblock %}

{% block content %}
<div class="auth-wrapper">
    <div class="auth-card">

        <div class="text-center mb-4">
            <div class="auth-logo">
                <i class="bi bi-airplane-fill"></i>
            </div>
            <h2 class="fw-bold mt-2">Create Account</h2>
            <p class="text-muted mb-0">Start planning your travels today</p>
        </div>

        <div class="card ww-card shadow-sm">
            <div class="card-body p-4">
                <h5 class="fw-bold mb-4">Register</h5>
                <form method="POST" action="/register">
                    <div class="mb-3">
                        <label class="form-label">Username</label>
                        <div class="input-group">
                            <span class="input-group-text"><i class="bi bi-person"></i></span>
                            <input type="text" name="username" class="form-control"
                                   placeholder="Choose a username" required autofocus>
                        </div>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Email</label>
                        <div class="input-group">
                            <span class="input-group-text"><i class="bi bi-envelope"></i></span>
                            <input type="email" name="email" class="form-control"
                                   placeholder="Enter your email" required>
                        </div>
                    </div>
                    <div class="mb-4">
                        <label class="form-label">Password</label>
                        <div class="input-group">
                            <span class="input-group-text"><i class="bi bi-lock"></i></span>
                            <input type="password" name="password" class="form-control"
                                   placeholder="Create a password" required>
                        </div>
                    </div>
                    <button type="submit" class="btn btn-ww w-100 py-2">
                        <i class="bi bi-person-plus-fill me-2"></i>Create Account
                    </button>
                </form>
            </div>
        </div>

        <div class="text-center mt-3 text-muted small">
            Already have an account?
            <a href="/login" class="ww-link ms-1">Sign in here</a>
        </div>
    </div>
</div>
{% endblock %}
