{% extends 'base.html' %}
{% block title %}Login – WanderWallet{% endblock %}

{% block content %}
<div class="auth-wrapper">
    <div class="auth-card">

        <div class="text-center mb-4">
            <div class="auth-logo">
                <i class="bi bi-airplane-fill"></i>
            </div>
            <h2 class="fw-bold mt-2">WanderWallet</h2>
            <p class="text-muted mb-0">Track your travel budget with ease</p>
        </div>

        <div class="card ww-card shadow-sm">
            <div class="card-body p-4">
                <h5 class="fw-bold mb-4">Sign In</h5>
                <form method="POST" action="/login">
                    <div class="mb-3">
                        <label class="form-label">Username</label>
                        <div class="input-group">
                            <span class="input-group-text"><i class="bi bi-person"></i></span>
                            <input type="text" name="username" class="form-control"
                                   placeholder="Enter username" required autofocus>
                        </div>
                    </div>
                    <div class="mb-4">
                        <label class="form-label">Password</label>
                        <div class="input-group">
                            <span class="input-group-text"><i class="bi bi-lock"></i></span>
                            <input type="password" name="password" class="form-control"
                                   placeholder="Enter password" required>
                        </div>
                    </div>
                    <button type="submit" class="btn btn-ww w-100 py-2">
                        <i class="bi bi-box-arrow-in-right me-2"></i>Login
                    </button>
                </form>
            </div>
        </div>

        <div class="text-center mt-3 text-muted small">
            Don't have an account?
            <a href="/register" class="ww-link ms-1">Register here</a>
        </div>
    </div>
</div>
{% endblock %}
